# This workflow builds the package and publishes it to PyPI whenever a
# version tag (e.g. 1.0.1) is pushed - not tied to creating a GitHub Release
# through the web UI, which can be flaky/inconsistent about recognizing an
# already-pushed tag. Tag first with git, then (optionally, whenever
# convenient) write up a GitHub Release with notes for that same tag - the
# two are decoupled now, so a Release's only purpose is human-readable
# changelog, not triggering anything.
#
# Auth is via PyPI Trusted Publishing (OIDC) - no API token/secret to create
# or leak. That requires a one-time setup on PyPI's project page
# (https://pypi.org/manage/project/robotframework-imagedetection/settings/publishing/):
# add a trusted publisher with this repo (Alpha-Centauri-00/robotframework-imagedetection),
# workflow filename (python-publish.yml), and environment name (pypi) below.
#
# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Upload Python Package

on:
  push:
    tags:
      - '*.*.*'

permissions:
  contents: read

jobs:
  deploy:

    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # required for PyPI Trusted Publishing (OIDC)

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0  # full history + tags, required for hatch-vcs to derive the correct version
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build
    - name: Build package
      run: python -m build
    - name: Publish package
      uses: pypa/gh-action-pypi-publish@release/v1
